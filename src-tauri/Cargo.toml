[package]
name = "delta-desktop"
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "delta_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = {version="2",features=[]}

[dependencies]
tauri = {version="2",features=[]}
delta-native-host = {git="https://github.com/n-ycta/delta-ui",rev="b54cd8118fd3663389d3dd08f46a8925d132d6da"}

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
